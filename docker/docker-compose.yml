version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: llm-gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: llm-gateway-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - ENVIRONMENT=docker
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../.env:/app/.env:ro
    command: python -m uvicorn src.api.app:create_app --host 0.0.0.0 --port 8000 --factory

volumes:
  redis_data:
