router:
  simple_max_tokens: 500
  medium_max_tokens: 2000
  timeout_ms: 5000

  # Keywords for classification
  reasoning_keywords:
    - "why"
    - "how"
    - "explain"
    - "analyze"
    - "compare"

  code_keywords:
    - "code"
    - "write"
    - "implement"
    - "function"
    - "debug"

  complex_keywords:
    - "novel"
    - "invent"
    - "research"
    - "advanced"
    - "architecture"

guardrails:
  input:
    enable_prompt_injection_detection: true
    enable_toxicity_filter: true
    max_length_tokens: 8000

    # Jailbreak patterns
    jailbreak_patterns:
      - "ignore.{0,20}(previous|prior|above).{0,20}instructions"
      - "forget.{0,20}(everything|instructions)"
      - "DAN\\s*[0-9]*:"

    toxicity_keywords:
      - "suicide"
      - "self-harm"
      - "bomb"
      - "terrorism"

  output:
    enable_toxicity_filter: true
    enable_pii_redaction: true
    enable_confidence_check: false

    pii_types:
      - "email"
      - "phone"
      - "ssn"

circuit_breaker:
  anthropic:
    failure_threshold: 5
    success_threshold: 2
    timeout_seconds: 60

  openai:
    failure_threshold: 5
    success_threshold: 2
    timeout_seconds: 60

cache:
  ttl_seconds: 3600
  max_size_mb: 1000

providers:
  anthropic:
    models:
      haiku: "claude-3-5-haiku-20241022"
      sonnet: "claude-3-5-sonnet-20241022"
    retry_max_attempts: 3
    timeout_seconds: 30

  openai:
    models:
      gpt4o: "gpt-4o"
    retry_max_attempts: 3
    timeout_seconds: 30

monitoring:
  prometheus:
    enabled: true
    port: 8001

  logging:
    level: "INFO"
    format: "json"
    retention_days: 7

alerts:
  low_savings_threshold_percentage: 20
  low_accuracy_threshold_percentage: 90
  check_window_days: 7
